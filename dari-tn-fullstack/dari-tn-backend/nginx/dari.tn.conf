# ╔══════════════════════════════════════════════════════════════╗
# ║         NGINX — Dari.tn — OVH VPS Ubuntu 25.04             ║
# ║   /etc/nginx/sites-available/dari.tn                        ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Prérequis : certbot --nginx -d dari.tn -d www.dari.tn -d api.dari.tn

# ─── Rate limiting global ─────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# ─── Cache réponses upstream ──────────────────────────────────
proxy_cache_path /var/cache/nginx/dari levels=1:2
                 keys_zone=dari_cache:10m max_size=500m
                 inactive=60m use_temp_path=off;

# ═══════════════════════════════════════════════════════════════
# Redirection HTTP → HTTPS
# ═══════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name dari.tn www.dari.tn api.dari.tn;
    return 301 https://$host$request_uri;
}

# ═══════════════════════════════════════════════════════════════
# Front-end — dari.tn & www.dari.tn
# ═══════════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dari.tn www.dari.tn;

    # ── TLS (Let's Encrypt via certbot) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/dari.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dari.tn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Sécurité ──────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;

    root  /var/www/dari-tn/dist;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1000;

    # Assets statiques avec cache long
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA : toujours servir index.html pour les routes front
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health check nginx
    location /nginx-health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

# ═══════════════════════════════════════════════════════════════
# Back-end API — api.dari.tn
# ═══════════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.dari.tn;

    ssl_certificate     /etc/letsencrypt/live/dari.tn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dari.tn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;

    client_max_body_size 15M;  # Pour les uploads d'images

    # Logs
    access_log /var/log/nginx/dari-api-access.log;
    error_log  /var/log/nginx/dari-api-error.log warn;

    # ── Rate limit auth ───────────────────────────────────────
    location ~ ^/api/auth/(login|register) {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Cache GET listings & search ──────────────────────────
    location ~ ^/api/(listings|search) {
        limit_req zone=api burst=40 nodelay;

        # Cache seulement les GET sans auth
        proxy_cache          dari_cache;
        proxy_cache_valid    200 2m;
        proxy_cache_methods  GET HEAD;
        proxy_cache_bypass   $http_authorization $http_pragma;
        proxy_no_cache       $http_authorization;
        add_header           X-Cache-Status $upstream_cache_status;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── Tout le reste de l'API ────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # Bloquer tout le reste
    location / {
        return 404;
    }
}
